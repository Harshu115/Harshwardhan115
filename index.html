<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HYOSUNG | Diwali Leave Planner 2026</title>
<style>
:root{--ink:#17122b;--purple:#32127a;--purple2:#5b21b6;--gold:#d7a63b;--cream:#fffaf0;--muted:#716b80;--line:#eee7da;--green:#17834b;--red:#c63d3d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(135deg,#f8f5ff 0,#fffaf0 50%,#f4efff 100%);color:var(--ink)}
button,input{font:inherit}.app{min-height:100vh}.topbar{height:74px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:12px;object-fit:cover}.brand strong{font-size:19px;letter-spacing:.08em;color:var(--purple)}.brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.nav{display:flex;align-items:center;gap:10px}.nav button,.logout{border:0;background:transparent;padding:10px 14px;border-radius:10px;cursor:pointer;color:#544e62}.nav button.active{background:#f0eafd;color:var(--purple);font-weight:700}.logout{border:1px solid var(--line);background:#fff}
main{max-width:1240px;margin:0 auto;padding:32px 22px 55px}.hero{background:radial-gradient(circle at 85% 20%,rgba(215,166,59,.22),transparent 28%),linear-gradient(135deg,#27105f,#5423a3);color:#fff;border-radius:24px;padding:34px;display:flex;justify-content:space-between;gap:30px;box-shadow:0 18px 50px rgba(50,18,122,.18);overflow:hidden;position:relative}.hero:after{content:"✦  ✧  ✦  ✧";position:absolute;right:26px;bottom:16px;color:#f4d58a;font-size:22px;letter-spacing:18px;opacity:.6}.hero h1{font-size:32px;margin:0 0 8px}.hero p{margin:0;color:#e7ddff}.range{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);padding:12px 16px;border:1px solid rgba(255,255,255,.18);border-radius:14px;white-space:nowrap}.range b{color:#f7d98a}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:22px;margin-top:22px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(45,28,78,.06)}.card h2{font-size:18px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:17px;border-radius:15px;background:#faf8ff;border:1px solid #eee8fb}.stat b{display:block;font-size:27px;color:var(--purple)}.stat span{font-size:12px;color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.dow{font-size:11px;text-transform:uppercase;color:#91899e;text-align:center;padding:5px}.day{min-height:72px;border:1px solid #eeeaf3;border-radius:13px;background:#fff;padding:9px;cursor:pointer;transition:.15s;position:relative}.day:hover{border-color:#b8a0e8;transform:translateY(-1px)}.day.disabled{opacity:.34;background:#fafafa;cursor:not-allowed}.day.selected{background:#f1eaff;border:2px solid var(--purple2);padding:8px}.day .num{font-weight:800}.day small{display:block;color:#8a8194;font-size:10px;margin-top:9px}.day.selected small{color:var(--purple2);font-weight:700}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--purple);color:#fff}.secondary{background:#f2edf9;color:var(--purple)}.danger{background:#fff0f0;color:var(--red)}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;text-transform:uppercase;color:#827a8c;letter-spacing:.05em}.pill{padding:5px 9px;border-radius:999px;background:#f1eaff;color:var(--purple);font-weight:700;font-size:11px}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 20%,#e7dbff,transparent 30%),radial-gradient(circle at 85% 80%,#ffe9b8,transparent 28%),#faf8ff}.loginbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 25px 70px rgba(45,25,95,.15)}.loginlogo{width:100px;height:100px;border-radius:20px;display:block;margin:0 auto 18px;object-fit:cover}.login h1{text-align:center;margin:0;color:var(--purple)}.login .sub{text-align:center}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#5e5669}.field input{width:100%;padding:13px 14px;border:1px solid #ddd5e7;border-radius:12px;outline:none}.field input:focus,.field textarea:focus{border-color:#8a67c9;box-shadow:0 0 0 3px #eee7fb}.field textarea{width:100%;padding:13px 14px;border:1px solid #ddd5e7;border-radius:12px;outline:none;resize:vertical;font:inherit}.loginbtn{width:100%;margin-top:8px;padding:14px}.hint{font-size:11px;color:#8b8391;text-align:center;margin-top:14px}.toast{position:fixed;right:20px;bottom:20px;background:#201637;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 10px 30px #0002;display:none;z-index:20}
.adminfilters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.adminfilters input,.adminfilters select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.hero{flex-direction:column}.topbar{padding:0 15px}.brand span{display:none}.nav button{padding:8px}.calendar{gap:5px}.day{min-height:62px;padding:7px}.day.selected{padding:6px}}
</style>

<script>
const SUPABASE_URL="https://ufrsbskwjzlsvvxuciox.supabase.co";
const SUPABASE_KEY="sb_publishable_oDZnVdHGu8rgUXmnsnJFQw_-uvWpdSX";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const START="2026-11-04",END="2026-11-18";
const HOLIDAYS={"2026-11-10":"Holiday","2026-11-11":"Holiday","2026-11-14":"Weekend Holiday","2026-11-15":"Weekend Holiday"};
const valid=(()=>{let a=[],d=new Date(START+"T00:00:00"),e=new Date(END+"T00:00:00");while(d<=e){a.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return a})();
let selected=new Set(),rows=[];

const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
const toast=s=>{let t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",2600)};
const esc=s=>{let d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const isHoliday=d=>!!HOLIDAYS[d];

function header(){return `<div class="topbar"><div class="brand"><img class="logo" src="${logo}"><div><strong>HYOSUNG</strong><span>Diwali Leave Management • 2026</span></div></div><div class="nav"><button class="logout" onclick="adminLoginView()">Admin</button></div></div>`}

function calendar(){
 let h=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="dow">${x}</div>`).join("");
 let first=new Date(START+"T00:00:00").getDay();for(let i=0;i<first;i++)h+="<div></div>";
 valid.forEach(d=>{let hol=isHoliday(d),sel=selected.has(d);h+=`<button type="button" class="day ${hol?"disabled":""} ${sel?"selected":""}" ${hol?"disabled":""} onclick="toggleDay('${d}')"><div class="num">${new Date(d+"T00:00:00").getDate()}</div><small>${hol?HOLIDAYS[d]:(sel?"LEAVE SELECTED":"Available")}</small></button>`});
 return h;
}
function renderEmployee(){
 document.getElementById("root").innerHTML=`<div class="app">${header()}<main>
 <div class="hero"><div><h1>🪔 Diwali Leave Planner</h1><p>Submit your Diwali leave plan for 04 Nov – 18 Nov 2026.</p></div><div class="range"><span>Leave window</span><b>04 Nov – 18 Nov 2026</b></div></div>
 <div class="grid"><div class="card">
 <h2>Employee Details</h2><div class="sub">Enter your name, official email and select leave dates.</div>
 <div class="field"><label>FULL NAME</label><input id="empName" placeholder="Enter your full name" maxlength="120"></div>
 <div class="field"><label>OFFICIAL EMAIL ID</label><input id="empEmail" type="email" placeholder="name@company.com" maxlength="160"></div>
 <div class="field"><label>NOTES <span style="font-weight:400;color:#999">(Optional)</span></label><textarea id="empNote" rows="3" maxlength="500" placeholder="Optional note for HR / manager"></textarea></div>
 <h2 style="margin-top:20px">Select Leave Dates</h2><div class="sub">10 & 11 Nov are holidays. 14 & 15 Nov are weekend holidays.</div>
 <div class="calendar">${calendar()}</div>
 <div class="actions"><button class="btn secondary" onclick="clearSelected()">Clear</button><button class="btn primary" onclick="submitLeave()">Submit Leave Request</button></div>
 </div>
 <div class="card"><h2>Your Selection</h2><div class="sub">Review before submitting.</div>
 <div class="stats"><div class="stat"><b>${selected.size}</b><span>Leave days</span></div><div class="stat"><b>${selected.size?fmt([...selected].sort()[0]):"—"}</b><span>First leave</span></div><div class="stat"><b>${selected.size?fmt([...selected].sort().slice(-1)[0]):"—"}</b><span>Last leave</span></div></div>
 <div style="margin-top:20px;padding:15px;border-radius:14px;background:#fffaf0;border:1px solid #f1dfad;font-size:12px;color:#685b3b"><b>Blocked dates</b><br>10 Nov • Holiday<br>11 Nov • Holiday<br>14 Nov • Weekend Holiday<br>15 Nov • Weekend Holiday</div>
 <div id="status" style="margin-top:18px"></div></div></div></main></div>`;
}
function toggleDay(d){if(isHoliday(d))return;selected.has(d)?selected.delete(d):selected.add(d);renderEmployee()}
function clearSelected(){selected.clear();renderEmployee()}

async function submitLeave(){
 const name=document.getElementById("empName").value.trim(),email=document.getElementById("empEmail").value.trim().toLowerCase(),note=document.getElementById("empNote").value.trim();
 if(name.length<2)return toast("Please enter your full name.");
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast("Please enter a valid official email ID.");
 if(!selected.size)return toast("Please select at least one leave date.");
 const {error}=await db.from("diwali_leave_submissions").insert({full_name:name,official_email:email,leave_days:[...selected].sort(),note:note||null});
 if(error){console.error(error);return toast("Submission failed. Please try again.");}
 toast("🪔 Leave request submitted successfully.");
 selected.clear();renderEmployee();
 document.getElementById("status").innerHTML="<div style='padding:14px;border-radius:14px;background:#edf9f1;color:#176b3c;border:1px solid #bfe7cd'><b>✓ Submitted successfully</b><br>Your leave request is stored in the HYOSUNG system.</div>";
}

function adminLoginView(){document.getElementById("root").innerHTML=`<div class="login"><div class="loginbox"><img class="loginlogo" src="${logo}"><h1>Admin Portal</h1><div class="sub">HYOSUNG • Diwali Leave Management 2026</div><div class="field"><label>ADMIN EMAIL</label><input id="ae" type="email" placeholder="admin@company.com"></div><div class="field"><label>PASSWORD</label><input id="ap" type="password" placeholder="Password"></div><button class="btn primary loginbtn" onclick="adminLogin()">Sign in to Dashboard →</button><button class="btn secondary loginbtn" onclick="renderEmployee()">← Back to Employee Form</button><div class="hint">Admin access uses Supabase Auth. The account must have profiles.role = admin.</div></div></div>`}
async function adminLogin(){
 const email=document.getElementById("ae").value.trim(),password=document.getElementById("ap").value;
 if(!email||!password)return toast("Enter admin email and password.");
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error)return toast(error.message);
 const p=await db.from("profiles").select("role").eq("id",data.user.id).single();
 if(p.error||p.data.role!=="admin"){await db.auth.signOut();return toast("This account is not configured as an admin.");}
 renderAdmin();
}
async function renderAdmin(){
 document.getElementById("root").innerHTML=`<div class="app">${header()}<main><div class="hero"><div><h1>🪔 Admin Dashboard</h1><p>Live employee leave submissions.</p></div><div class="range"><span>Window</span><b>04 Nov – 18 Nov 2026</b></div></div>
 <div class="card" style="margin-top:22px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2>Leave Overview</h2><div class="sub">Supabase-backed live data.</div></div><div><button class="btn secondary" onclick="exportCSV()">Export CSV</button><button class="btn danger" style="margin-left:8px" onclick="adminLogout()">Sign out</button></div></div>
 <div class="stats"><div class="stat"><b id="people">—</b><span>Employees submitted</span></div><div class="stat"><b id="days">—</b><span>Total leave days</span></div><div class="stat"><b id="dates">—</b><span>Leave dates used</span></div></div></div>
 <div class="card" style="margin-top:22px"><h2>Employee Submissions</h2><div class="sub">Name • official email • selected dates • notes</div><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Official Email</th><th>Days</th><th>Selected Dates</th><th>Notes</th><th>Submitted</th></tr></thead><tbody id="ar"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></div></div>
 </main></div>`;
 const r=await db.from("diwali_leave_submissions").select("*").order("created_at",{ascending:false});
 if(r.error){toast("Could not load submissions.");return}
 rows=r.data||[];let total=rows.reduce((s,x)=>s+(x.leave_days||[]).length,0),u=new Set(rows.flatMap(x=>x.leave_days||[]));
 document.getElementById("people").textContent=rows.length;document.getElementById("days").textContent=total;document.getElementById("dates").textContent=u.size;
 document.getElementById("ar").innerHTML=rows.length?rows.map(x=>`<tr><td><b>${esc(x.full_name)}</b></td><td>${esc(x.official_email)}</td><td><span class="pill">${(x.leave_days||[]).length}</span></td><td>${(x.leave_days||[]).slice().sort().map(fmt).join(", ")}</td><td>${esc(x.note||"—")}</td><td>${new Date(x.created_at).toLocaleString("en-IN")}</td></tr>`).join(""):`<tr><td colspan="6" class="empty">No submissions yet.</td></tr>`;
}
function exportCSV(){if(!rows.length)return toast("No submissions to export.");let head=["Name","Official Email","Leave Days","Selected Dates","Notes","Submitted At"],body=rows.map(x=>[x.full_name,x.official_email,(x.leave_days||[]).length,(x.leave_days||[]).slice().sort().join(" | "),x.note||"",new Date(x.created_at).toLocaleString("en-IN")]);let csv=[head,...body].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="hyosung-diwali-leave-2026.csv";a.click();URL.revokeObjectURL(a.href)}
async function adminLogout(){await db.auth.signOut();rows=[];renderEmployee()}
renderEmployee();
</script>
</body></html>
